name: Build OLM bundle and catalog images

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: bundle-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Resolve manual version
        id: version
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "value=0.0.0-manual-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Regenerate and validate OLM artifacts
        run: make release-bundle VERSION=${{ steps.version.outputs.value }}

      - name: Prepare bundle image metadata
        id: bundle-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/crmarques/declarest-operator-bundle
          tags: |
            type=sha,prefix=manual-

      - name: Prepare catalog image metadata
        id: catalog-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/crmarques/declarest-operator-catalog
          tags: |
            type=sha,prefix=manual-

      - name: Build bundle image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: bundle.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ steps.bundle-meta.outputs.tags }}
          labels: ${{ steps.bundle-meta.outputs.labels }}

      - name: Build catalog image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: catalog.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ steps.catalog-meta.outputs.tags }}
          labels: ${{ steps.catalog-meta.outputs.labels }}
